name: Build Lindroid RootFS (CGroup v1 Compatible)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      current_date: 20250417
      release_suffix: _20250417
      LINDROID_VERSION: nightly
      LINDROID_IDENTIFIER: arm64-base

    strategy:
      matrix:
        config:
          - edition: base
            arch: arm64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Create build output dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull builder container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start persistent container
        run: |
          CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            -v ${{ github.workspace }}:/buildd/sources \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
            sleep infinity)
          echo "CONTAINER_HASH=$CONTAINER_HASH" >> $GITHUB_ENV

      - name: Inject cgroup v1 compatibility to recipe
        run: |
          echo "Injecting cgroup v1 compatibility to recipe..."
          mkdir -p ./generated/hooks
          cat <<EOF > ./generated/hooks/cgroupv1.yaml
actions:
  - action: run
    description: Enforce systemd use cgroup v1
    command: |
      mkdir -p /target/etc/systemd/system.conf.d
      echo -e "[Manager]\nDefaultControllers=\nLegacyControllers=cpu,memory,cpuset,devices,freezer,pids" > /target/etc/systemd/system.conf.d/cgroupv1.conf
      echo -e "[Service]\nEnvironment=SYSTEMD_UNIFIED_CGROUP_HIERARCHY=0" > /target/etc/systemd/system.conf.d/env.conf
EOF

      - name: Build rootfs
        run: |
          echo "Building rootfs for $LINDROID_IDENTIFIER..."
          docker exec $CONTAINER_HASH /bin/sh -c "cd /buildd/sources && \
            ./generate_recipe.py && \
            cat ./generated/hooks/cgroupv1.yaml >> ./generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml && \
            debos --disable-fakemachine generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml"

      - name: Stop and remove container
        if: always()
        run: docker rm -f $CONTAINER_HASH || true
