name: Build Lindroid Base RootFS

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    env:
      SUITE: trixie
      ARCH: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU for ARM64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Pull systemd-enabled container (for LXC support)
        run: docker pull ghcr.io/utensils/docker-debian-systemd:bookworm

      - name: Start container with systemd + cgroup support
        run: |
          echo CONTAINER_HASH=$(docker run --detach --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ${PWD}:/buildd/sources \
            -v /tmp/buildd-results:/buildd/out \
            --security-opt seccomp=unconfined \
            ghcr.io/utensils/docker-debian-systemd:bookworm) >> $GITHUB_ENV

      - name: Install deps and QEMU in container
        run: |
          docker exec $CONTAINER_HASH bash -c "\
            apt update && apt install -y qemu-user-static debootstrap debos systemd && \
            [ -f /usr/bin/qemu-aarch64-static ] || cp $(which qemu-aarch64-static) /usr/bin/"

      - name: Run Debos
        run: |
          docker exec $CONTAINER_HASH bash -c "\
            cd /buildd/sources && \
            debos --disable-fakemachine rootfs-templates/lindroid_base.yaml"

      - name: Stop container
        if: always()
        run: docker stop $CONTAINER_HASH || true
