name: Build RootFS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      LINDROID_VERSION: nightly
      LINDROID_IDENTIFIER: arm64-base
      current_date: ${{ github.run_number }}
      release_suffix: _${{ github.run_number }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Create build output dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull container image
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start container
        run: |
          echo "Starting container..."
          CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${{ github.workspace }}:/buildd/sources \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 /sbin/init)
          echo "CONTAINER_HASH=$CONTAINER_HASH" >> $GITHUB_ENV

      - name: Build rootfs
        run: |
          echo "Building rootfs for $LINDROID_IDENTIFIER..."
          docker exec $CONTAINER_HASH /bin/sh -c "cd /buildd/sources && ./generate_recipe.py && debos --disable-fakemachine generated/lindroid-${LINDROID_IDENTIFIER}.yaml"

      - name: Stop and remove container
        if: always()
        run: docker rm -f $CONTAINER_HASH || true
