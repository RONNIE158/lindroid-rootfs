name: Build Lindroid Rootfs

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y debos qemu-user-static

      - name: Create build directories
        run: |
          mkdir -p generated out

      - name: Generate lindroid-chroot-kde.yaml
        run: |
          cat << 'EOF' > generated/lindroid-chroot-kde.yaml
          architecture: arm64

          actions:
            - action: debootstrap
              suite: trixie
              components:
                - main
              mirror: http://deb.debian.org/debian
              variant: minbase

            - action: run
              description: Add Lindroid repo
              chroot: true
              command: |
                echo "deb [trusted=yes] https://repo.lindroid.org/repository/lindroid trixie main" > /etc/apt/sources.list.d/lindroid.list
             - action: run
                chroot: true
                description: Add Lindroid repo and key
                command: |
                   mkdir -p /etc/apt/keyrings
                   cp /buildd/sources/public-key.asc /etc/apt/keyrings/lindroid.asc
                   echo "deb [signed-by=/etc/apt/keyrings/lindroid.asc] https://repo.lindroid.org/repository/lindroid trixie main" > /etc/apt/sources.list.d/lindroid.list
                   apt update || true

            - action: apt
              description: Install essential packages
              chroot: true
              packages:
                - libhybris
                - libhybris-test
                - lindroid-quirks
                - nano
                - strace
                - sudo
                - sddm
                - adduser
                - locales
                - desktop-base
                - evtest
                - iproute2

            - action: apt
              description: Install PipeWire + audio support
              chroot: true
              packages:
                - libpipewire-module-lindroid
                - libcanberra-pulse
                - pipewire-audio
                - wireplumber
                - pipewire-pulse
                - pipewire-alsa
                - pipewire-jack

            - action: apt
              description: Install KDE + Wayland + drihybris backend
              chroot: true
              packages:
                - kde-full
                - kwin-wayland
                - qtwayland5
                - maliit-keyboard
                - sddm-theme-debian-breeze
                - plasma-workspace
                - firefox-esr
                - drihybris

            - action: run
              description: Enable locales
              chroot: true
              command: |
                echo "en_US.UTF-8 UTF-8" >> /etc/locale.gen
                locale-gen

            - action: run
              description: Create default user
              chroot: true
              command: |
                useradd -m -s /bin/bash lindroid
                echo "lindroid ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

            - action: run
              description: Clean up
              chroot: true
              command: |
                apt clean
                rm -rf /var/lib/apt/lists/*
          EOF

      - name: Run Debos to build rootfs
        run: |
          sudo debos --disable-fakemachine generated/lindroid-chroot-kde.yaml
