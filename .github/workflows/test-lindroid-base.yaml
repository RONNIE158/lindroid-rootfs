name: Test Lindroid Base RootFS Builder

on:
  workflow_dispatch:
  push:
    branches:
      - trixie
  pull_request:
    paths:
      - 'rootfs-templates/lindroid_base.yaml'
      - '.github/workflows/test-rootfs-builder.yaml'

jobs:
  build-test:
    name: Build lindroid_base.yaml
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Create build output dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull builder container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start container
        run: |
          CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
            tail -f /dev/null)
          echo "CONTAINER_HASH=$CONTAINER_HASH" >> $GITHUB_ENV

      - name: Build lindroid_base.yaml in container
        run: |
          docker exec $CONTAINER_HASH /bin/bash -c "\
            cd /buildd/sources && \
            debos --disable-fakemachine rootfs-templates/lindroid_base.yaml"

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f $CONTAINER_HASH || true
