name: Build Lindroid RootFS (CGroup v1 + chroot backend)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      current_date: 20250417
      release_suffix: _20250417
      LINDROID_VERSION: nightly
      LINDROID_IDENTIFIER: arm64-base

    strategy:
      matrix:
        config:
          - edition: base
            arch: arm64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Prepare directories
        run: |
          mkdir -p /tmp/buildd-results hooks

      - name: Write CGroup v1 hook
        run: |
          cat > hooks/cgroup-v1.yaml << 'EOF'
- action: run
  description: Mount legacy CGroup v1 controllers
  chroot: true
  command: |
    for c in cpu cpuacct cpuset devices memory pids; do
      mkdir -p /sys/fs/cgroup/$c
      mount -t cgroup -o $c cgroup /sys/fs/cgroup/$c
      mkdir -p /sys/fs/cgroup/$c/payload
    done
    mkdir -p /target/payload
EOF

      - name: Pull builder container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start Container (standard config)
        run: |
          echo CONTAINER_HASH=$(
            docker run -d --privileged \
              -v /tmp/buildd-results:/buildd/out \
              -v /dev:/host-dev \
              -v /sys/fs/cgroup:/sys/fs/cgroup \
              -v ${PWD}:/buildd/sources \
              --mount type=tmpfs,destination=/payload \
              --security-opt seccomp:unconfined \
              registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
              /sbin/init
          ) >> $GITHUB_ENV

      - name: Build rootfs using chroot backend
        run: |
          echo "Building rootfs for $LINDROID_IDENTIFIER..."
          docker exec $CONTAINER_HASH /bin/sh -c "\
            cd /buildd/sources && \
            ./generate_recipe.py && \
            cp hooks/cgroup-v1.yaml generated/hooks.yaml && \
            debos \
              --fakemachine-backend=chroot \
              --disable-fakemachine \
              --recipe-hook generated/hooks.yaml \
              generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml
          "

      - name: Stop and clean up container
        if: always()
        run: docker rm -f $CONTAINER_HASH || true
