name: Build Lindroid KDE RootFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Debos Chroot Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debos & Dependencies
        run: |
          sudo apt update
          sudo apt install -y debos qemu-user-static wget

      - name: Copy Lindroid GPG key from repo
        run: |
          mkdir -p rootfs/buildd/sources
          cp public-key.asc rootfs/buildd/sources/public-key.asc

      - name: Run Debos
        run: |
          sudo debos --disable-fakemachine generated/lindroid-chroot-kde.yaml

      - name: Archive RootFS
        run: |
          sudo tar -czf lindroid-kde-rootfs.tar.gz -C chroot .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindroid-kde-rootfs
          path: lindroid-kde-rootfs.tar.gz
