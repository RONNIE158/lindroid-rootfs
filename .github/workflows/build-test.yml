name: lindroid rootfs-builder

on:
  workflow_dispatch:
  push:
    branches:
      - trixie
  schedule:
    - cron: "59 23 * * *"

jobs:
  once:
    runs-on: ubuntu-20.04
    name: Generate matrix
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate matrix
        id: gen-matrix
        run: |
          JOBS="$(./generate_recipe.py --matrix)"
          echo ::set-output name=matrix::${JOBS}

  build:
    runs-on: ubuntu-20.04
    needs: once

    strategy:
      fail-fast: true
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}

    name: ${{ matrix.config.job_name }}

    steps:
      - name: Get current date
        run: echo "current_date=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Set suffix
        run: echo "release_suffix=_${{ env.current_date }}" >> $GITHUB_ENV

      - name: Set nightly version
        if: startsWith(github.ref, 'refs/tags/lindroid') != true
        run: echo "LINDROID_VERSION=nightly" >> $GITHUB_ENV

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/lindroid') == true
        run: echo "LINDROID_VERSION=$(echo ${{ github.ref }} | rev | cut -d'/' -f1 | rev)" >> $GITHUB_ENV

      - name: Set identifier
        run: echo "LINDROID_IDENTIFIER=${{ matrix.config.arch }}-${{ matrix.config.edition }}" >> $GITHUB_ENV

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: QEMU set-up
        uses: docker/setup-qemu-action@v1

      - name: Create build dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start Container
        id: start-container
        run: |
          CONTAINER_HASH=$(docker run -d --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 /sbin/init)
          echo "CONTAINER_HASH=$CONTAINER_HASH" >> $GITHUB_ENV

      - name: Check if container is running
        run: |
          CONTAINER_STATUS=$(docker inspect -f '{{.State.Running}}' $CONTAINER_HASH)
          if [ "$CONTAINER_STATUS" != "true" ]; then
            echo "Container is not running. Starting container..."
            docker start $CONTAINER_HASH
          else
            echo "Container is already running."
          fi

      - name: Run build inside container
        run: |
          docker exec $CONTAINER_HASH /bin/sh -c 'cd /buildd/sources; ./generate_recipe.py && debos --disable-fakemachine generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: /tmp/buildd-results
          
  prepare:
    runs-on: ubuntu-20.04
    name: Create GitHub release
    needs: build
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}${{ steps.create_nightly.outputs.upload_url }}

    steps:
      - name: Free up some storage
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Delete old nightly release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        if: startsWith(github.ref, 'refs/tags/lindroid') != true
        with:
          delete_release: true
          tag_name: nightly
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Tag snapshot
        if: startsWith(github.ref, 'refs/tags/lindroid') != true
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          tag: nightly

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: lindroid-out

      - name: Create SHA256SUMS
        run: |
          cd lindroid-out
          for x in lindroid-out-*; do
            cd $x
            sha256sum * >> ../SHA256SUMS
            cd ..
          done

      - name: Create stable release (drafted)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/lindroid')
        uses: softprops/action-gh-release@v1
        with:
          files: lindroid-out/SHA256SUMS
          tag_name: ${{ github.ref }}
          draft: true
          prerelease: false
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Create nightly release
        id: create_nightly
        if: startsWith(github.ref, 'refs/tags/lindroid') != true
        uses: softprops/action-gh-release@v1
        with:
          files: lindroid-out/SHA256SUMS
          tag_name: nightly
          draft: false
          prerelease: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  publish:
    runs-on: ubuntu-20.04
    needs: [once, prepare]
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}${{ steps.create_nightly.outputs.upload_url }}

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.once.outputs.matrix) }}

    name: Publish ${{ matrix.config.job_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: lindroid-out-${{ matrix.config.arch }}-${{ matrix.config.edition }}
          path: lindroid-out

      - name: Create stable release (drafted)
        id: create_release
        if: startsWith(github.ref, 'refs/tags/lindroid')
        uses: softprops/action-gh-release@v1
        with:
          files: lindroid-out/*
          tag_name: ${{ github.ref }}
          draft: true
          prerelease: false

      - name: Create nightly release
        id: create_nightly
        if: startsWith(github.ref, 'refs/tags/lindroid') != true
        uses: softprops/action-gh-release@v1
        with:
          files: lindroid-out/*
          tag_name: nightly
          draft: false
          prerelease: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
