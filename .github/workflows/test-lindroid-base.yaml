name: Build Lindroid Base RootFS

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    env:
      SUITE: trixie
      ARCH: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU for ARM64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Pull container with systemd & cgroup support
        run: docker pull jrei/systemd-debian:bookworm

      - name: Start container with systemd and cgroups
        run: |
          echo CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ${PWD}:/buildd/sources \
            --tmpfs /run \
            --tmpfs /run/lock \
            --cgroupns=host \
            --cap-add=SYS_ADMIN \
            --security-opt seccomp=unconfined \
            jrei/systemd-debian:bookworm \
            /sbin/init) >> $GITHUB_ENV

      - name: Install deps + qemu in container
        run: |
          docker exec $CONTAINER_HASH bash -c "\
          export DEBIAN_FRONTEND=noninteractive; \
          apt-get update || true; \
          apt-get install -y --no-install-recommends gnupg ca-certificates curl; \
          apt-get install -y qemu-user-static systemd debootstrap sudo"

      - name: Run Debos
        run: |
          docker exec $CONTAINER_HASH bash -c "\
            cd /buildd/sources && \
            debos --disable-fakemachine rootfs-templates/lindroid_base.yaml"

      - name: Stop container
        if: always()
        run: |
          docker stop $CONTAINER_HASH || true
