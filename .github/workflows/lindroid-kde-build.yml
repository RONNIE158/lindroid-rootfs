name: Build Lindroid KDE RootFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Debos Chroot Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debos & Dependencies
        run: |
          sudo apt update
          sudo apt install -y debos qemu-user-static wget

      - name: Copy Lindroid GPG key from repo
        run: |
          mkdir -p rootfs/buildd/sources
          cp public-key.asc rootfs/buildd/sources/public-key.asc

      - name: Configure Lindroid repo + install packages
        run: |
         sudo chroot rootfs /bin/bash -c "
         mkdir -p /etc/apt/keyrings
         cp /buildd/sources/public-key.asc /etc/apt/keyrings/lindroid.asc
         echo 'deb [signed-by=/etc/apt/keyrings/lindroid.asc] https://repo.lindroid.org/repository/lindroid trixie main' > /etc/apt/sources.list.d/lindroid.list
         apt update || true

      - name: Run Debos
        run: |
          sudo debos --disable-fakemachine generated/lindroid-chroot-kde.yaml

      - name: Archive RootFS
        run: |
          sudo tar -czf lindroid-kde-rootfs.tar.gz -C chroot .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindroid-kde-rootfs
          path: lindroid-kde-rootfs.tar.gz
