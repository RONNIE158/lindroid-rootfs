name: Build test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      current_date: 20250417
      release_suffix: _20250417
      LINDROID_VERSION: nightly
      LINDROID_IDENTIFIER: arm64-base

    strategy:
      matrix:
        config:
          - edition: base
            arch: arm64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Create build output dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull builder container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start persistent container (CGroup v1, mount only devices cgroup)
        run: |
          CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup/devices:/sys/fs/cgroup/devices:rw \  # Mount cgroup devices only
            -v ${{ github.workspace }}:/buildd/sources \
            --security-opt seccomp:unconfined \
            --mount type=tmpfs,destination=/tmp \
            --mount type=tmpfs,destination=/run \
            --mount type=tmpfs,destination=/payload \
            --env CGROUP_MODE=cgroupv1 \  # Force cgroup v1 usage via environment variable
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
            sleep infinity)
          echo "CONTAINER_HASH=$CONTAINER_HASH" >> $GITHUB_ENV

      - name: Build rootfs (LXC-compatible, CGroup v1)
        run: |
          echo "Building rootfs for $LINDROID_IDENTIFIER..."
          docker exec $CONTAINER_HASH /bin/sh -c "
            # Disable unnecessary cgroup v2 dependencies for compatibility with cgroup v1
            sed -i 's/cgroup2/cgroup1/g' /etc/debos/* # Modify debos recipe if needed
            cd /buildd/sources && \
            ./generate_recipe.py && \
            debos --disable-fakemachine generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml"

      - name: Stop and remove container
        if: always()
        run: docker rm -f $CONTAINER_HASH || true
