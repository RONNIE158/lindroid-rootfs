name: Build Lindroid RootFS

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config:
          - edition: base
            arch: arm64
          - edition: base
            arch: amd64

    env:
      current_date: 20250417
      release_suffix: _20250417
      LINDROID_VERSION: nightly
      LINDROID_IDENTIFIER: ${{ matrix.config.arch }}-${{ matrix.config.edition }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: QEMU set-up
        uses: docker/setup-qemu-action@v1

      - name: Create build dir
        run: mkdir -p /tmp/buildd-results

      - name: Pull container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start container
        run: |
          echo "Starting container..."
          echo "CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
            /sbin/init)" >> $GITHUB_ENV

      - name: Wait for container init
        run: sleep 10

      - name: Build rootfs
        run: |
          echo "Building rootfs for $LINDROID_IDENTIFIER..."
          docker exec $CONTAINER_HASH /bin/sh -c "cd /buildd/sources && ./generate_recipe.py && debos --disable-fakemachine generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml"

      - name: Stop container
        if: always()
        run: docker stop $CONTAINER_HASH || true
