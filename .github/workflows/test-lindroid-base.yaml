name: Build Lindroid Base RootFS

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    env:
      SUITE: trixie
      ARCH: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pull Droidian Rootfs Builder
        run: docker pull quay.io/droidian/rootfs-builder:next-amd64

      - name: Start container
        run: |
          echo "CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            quay.io/droidian/rootfs-builder:next-amd64 sleep infinity)" >> $GITHUB_ENV

      - name: Install dependencies inside container
        run: |
          docker exec $CONTAINER_HASH bash -c "\
            apt update && \
            apt install -y sudo debos qemu-user-static"

      - name: Copy QEMU static binary
        run: |
          docker exec $CONTAINER_HASH bash -c "\
            cp \$(command -v qemu-aarch64-static) /usr/bin/qemu-aarch64-static"

      - name: Run Debos in container
        run: |
          docker exec $CONTAINER_HASH bash -c "\
            cd /buildd/sources && \
            debos --internal-qemu rootfs-templates/lindroid_base.yaml"

      - name: Stop container
        if: always()
        run: docker stop $CONTAINER_HASH || true
