{{- $architecture := or .architecture "arm64" -}}
{{- $suite := "trixie" -}}
{{- $use_internal_repository := or .use_internal_repository "no" -}}

{{- $username := or .username "lindroid" -}}
{{- $password := or .password "lindroid" -}}
{{- $hostname := or .hostname "lindroid" -}}

architecture: {{ $architecture }}
actions:

  - action: recipe
    description: Generate base rootfs
    recipe: recipes/lindroid_base.yaml
    variables:
      architecture: {{ $architecture }}
      suite: {{ $suite }}
      use_internal_repository: {{ $use_internal_repository }}

  - action: run
    chroot: true
    description: Add lindroid repo
    command: echo "deb [trusted=yes] https://repo.lindroid.org/repository/lindroid trixie main" > /etc/apt/sources.list.d/lindroid-production.list

  - action: apt
    chroot: true
    description: install packages
    packages:
      - libhybris-common1
      - libhybris
      - libhybris-test
      - lindroid-quirks
      - nano
      - strace
      - sudo
      - sddm
      - adduser
      - locales
      - desktop-base
      - evtest
      - iproute2
      - libpipewire-module-lindroid
      - libcanberra-pulse
      - pipewire-audio
      - wireplumber
      - pipewire-pulse
      - pipewire-alsa
      - pipewire-jack
    continue_on_error: true  # This will allow to continue even if some packages fail

  - action: run
    description: Handle package errors and continue
    chroot: true
    command: |
      if [ $? -ne 0 ]; then
        echo "Some packages were not installed successfully, continuing..."
      fi

  - action: run
    description: Set up default user
    chroot: true
    script: scripts/setup-user.sh {{ $username }} {{ $password }}

  - action: run
    description: Set up system
    chroot: true
    script: scripts/setup-system.sh {{ $hostname }}

  - action: run
    chroot: true
    description: Safe apt clean (skip if no systemd-nspawn)
    command: |
      if [ ! -d "/run/systemd/nspawn/propagate/root" ]; then
        echo "Skipping apt clean because not running in systemd-nspawn"
      else
        apt clean
      fi 

{{ if eq $architecture "armhf" }}
  - action: run
    chroot: true
    description: add arm64 arch
    command: dpkg --add-architecture arm64

  - action: run
    chroot: true
    description: update repositories
    command: apt update
{{end}}
