name: Build Lindroid RootFS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      current_date: 20250417
      release_suffix: _20250417
      LINDROID_VERSION: nightly
      LINDROID_IDENTIFIER: arm64-base

    strategy:
      matrix:
        config:
          - edition: base
            arch: arm64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Create build output dir
        run: mkdir -p /tmp/buildd-results hooks

      - name: Create cgroup‑v1 & disable apt‑clean hook
        run: |
          cat > hooks/cgroup-and-no-clean.yaml << 'EOF'
- action: run
  description: Enable legacy CGroup v1 & disable apt clean
  chroot: true
  command: |
    #=== mount legacy cgroup v1 controllers ===
    mkdir -p /sys/fs/cgroup/{cpu,cpuacct,cpuset,devices,memory,pids}
    mount -t cgroup -o cpu cpu /sys/fs/cgroup/cpu
    mount -t cgroup -o cpuacct cpuacct /sys/fs/cgroup/cpuacct
    mount -t cgroup -o cpuset cpuset /sys/fs/cgroup/cpuset
    mount -t cgroup -o devices devices /sys/fs/cgroup/devices
    mount -t cgroup -o memory memory /sys/fs/cgroup/memory
    mount -t cgroup -o pids pids /sys/fs/cgroup/pids

    #=== stub out apt clean ===
    echo -e '#!/bin/sh\nexit 0' > /usr/sbin/apt-clean
    chmod +x /usr/sbin/apt-clean
EOF

      - name: Pull builder container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start Container
        run: |
          echo CONTAINER_HASH=$(docker run --detach --privileged \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            -v ${PWD}:/buildd/sources \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
            /sbin/init) >> $GITHUB_ENV

      - name: Build rootfs
        run: |
          echo "Building rootfs for $LINDROID_IDENTIFIER..."
          docker exec $CONTAINER_HASH /bin/sh -c "\
            cd /buildd/sources && \
            ./generate_recipe.py && \
            # inject our hook before debos runs
            cp hooks/cgroup-and-no-clean.yaml generated/hook.yaml && \
            # remove any built‑in apt clean actions
            sed -i '/description: apt clean/,/command: apt clean/d' generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml && \
            # run debos with our hook
            debos --disable-fakemachine \
              --recipe-hook generated/hook.yaml \
              generated/lindroid-${{ matrix.config.edition }}-${{ matrix.config.arch }}.yaml"

      - name: Stop and remove container
        if: always()
        run: docker rm -f $CONTAINER_HASH || true
