name: Build Lindroid Base RootFS

on:
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    env:
      SUITE: trixie
      ARCH: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup QEMU for ARM64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Pull rootfs-builder container
        run: docker pull registry.lindroid.org/lindroid/rootfs-builder:next-amd64

      - name: Start builder container
        run: |
          CONTAINER_HASH=$(docker run --detach --privileged \
            -v ${PWD}:/buildd/sources \
            -v /tmp/buildd-results:/buildd/out \
            -v /dev:/host-dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup \
            --security-opt seccomp:unconfined \
            registry.lindroid.org/lindroid/rootfs-builder:next-amd64 \
            tail -f /dev/null)
          echo "CONTAINER_HASH=$CONTAINER_HASH" >> $GITHUB_ENV

      - name: Inject QEMU & run builder
        run: |
         docker exec $CONTAINER_HASH bash -c "\
         apt update && apt install -y qemu-user-static && \
         [ -f /usr/bin/qemu-aarch64-static ] || cp $(which qemu-aarch64-static) /usr/bin/ && \
         cd /buildd/sources && \
         debos --disable-fakemachine rootfs-templates/lindroid_base.yaml"



      - name: Stop container
        if: always()
        run: |
          docker stop $CONTAINER_HASH || true
